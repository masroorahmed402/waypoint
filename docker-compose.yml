services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iso
      POSTGRES_PASSWORD: iso_dev_password
      POSTGRES_DB: iso
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iso"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
